{{template "header" .}}
{{$csrf := .CSRF}}
{{with .Data}}
<div class="card">
  {{if not .VaultEnabled}}<p class="flash flash-err">Set <code>GOSHPANEL_SECRETS_KEY</code> to enable encrypted secrets.</p>{{end}}
  <form method="post" action="/secrets/save">
    <input type="hidden" name="csrf_token" value="{{$csrf}}">
    <label>Name <input name="name" required></label>
    <label>Value <input name="value" type="password" required></label>
    <button class="btn btn-primary">Save secret</button>
  </form>
  <table class="list"><tbody>{{range .Secrets}}<tr><td><code>{{.Name}}</code></td><td class="muted">encrypted</td><td><form method="post" action="/secrets/delete"><input type="hidden" name="csrf_token" value="{{$csrf}}"><input type="hidden" name="name" value="{{.Name}}"><button class="btn btn-sm btn-danger">Delete</button></form></td></tr>{{end}}</tbody></table>
</div>
{{end}}
{{template "footer" .}}
